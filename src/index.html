<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Savepoint — your game library</title>
    <meta name="description" content="Savepoint keeps every game you own, play and want in one place: status, playtime, ratings and release countdowns." />
    <base href="/" />
    <meta
      name="viewport"
      content="viewport-fit=cover, width=device-width, initial-scale=1.0"
    />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="color-scheme" content="dark" />
    <meta name="theme-color" content="#070b17" />

    <!-- Preconnect to external domains -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Inter:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="assets/icon/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="assets/icon/favicon.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="assets/icon/apple-touch-icon.png" />
    <link rel="manifest" href="assets/manifest.webmanifest" />

    <!-- Add to homescreen for iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
  </head>
  <body class="dark">
    <app-root></app-root>
  </body>
</html>
