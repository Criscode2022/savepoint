<header class="page-header" [class.page-header--titled]="!!title">
  @if (backHref) {
    <ion-back-button
      class="page-header__back"
      [class.page-header__back--labelled]="!!backLabel"
      [defaultHref]="backHref"
      [text]="backLabel"
      icon="arrow-back-outline"
      [attr.aria-label]="backLabel ? 'Back to ' + backLabel : 'Back'"
    ></ion-back-button>
  }

  @if (title) {
    <div class="page-header__titles">
      <h1 class="page-header__title">{{ title }}</h1>
      @if (subtitle) {
        <p class="page-header__subtitle">{{ subtitle }}</p>
      }
    </div>
  }

  <div class="page-header__actions">
    <ng-content select="[pageActions]" />
  </div>
</header>
